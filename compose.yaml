include:
  - ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_UTILS:?}/shared_sckts.yaml
  - ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_NGINX:?}/compose.yaml
  - ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_IOCAINE:?}/compose.yaml
  - ./deployment/anubis/compose.yaml

services:
  git_server:
    container_name: git_server
    extends:
      file: ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_UTILS:?}/shared_sckts.yaml
      service: shared_sckts_user
    profiles:
      - ${DOCKER_DEFAULT_PROFILE:?}
    image: codeberg.org/forgejo/forgejo:15
    restart: unless-stopped
    # NOTE: we can't seem to set `user:` since forgejo must use its own internal user initially
    # to initialize some stuff in `/etc/` etc.
    # SYNC: make sure firewalls (e.g. `ufw`) don't block these ports!
    ports:
      # for forgejo's ssh server (ssh git urls); set bound port to >=1024 for nonroot container user
      - "2222:${FORGEJO_SSH_PORT}"
    volumes:
      # container-generated data (specifically, main app state)
      # SYNC: paths in which the container produces data (currently should be default)
      - type: volume
        source: git_server_data
        target: ${GIT_SERVER_DATA_DEST_DIR:?}
      # host-provided data; we must provide all of `custom/` to be able to chown all of it later
      - type: bind
        source: ${FORGEJO_CUSTOM_SRC_DIR:?}
        target: ${FORGEJO_CUSTOM_DEST_DIR:?}
        # not `read_only` since `envsubst` needs to write to this, and we can't bind only the input
        # `envsubst` file as `pre_start` runs in a separate container, so the output file is lost
      # the docs have this so
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    env_file:
      # for `envsubst`
      - ./.env
    environment:
      # after init, forgejo relies on this to set user/group (for its internal `git` user)
      USER_UID: ${DOCKER_NONROOT_UID:?}
      USER_GID: ${DOCKER_NGINX_GID:?}
      FORGEJO_CUSTOM: ${FORGEJO_CUSTOM_DEST_DIR:?}
    healthcheck:
      test: ["CMD", "curl", "-I", "https://${GIT_SERVER_SITE_DOMAIN:?}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    pre_start:
      # use `envsubst` instead of passing some config options here as environment variables
      # since also passing a config file seems to override the environment variables
      # SYNC: paths inside container
      - image: akubrinsky/envsubst
        user: ${DOCKER_ROOT_USER:?}
        # note that `sh -c` is required for `envsubst` (probably because it deals with env vars?)
        command: >
          sh -c '
            [ -f ${GIT_SERVER_CONFIG_DEST_FILE:?}.template ] \
              && envsubst < ${GIT_SERVER_CONFIG_DEST_FILE:?}.template \
              > ${GIT_SERVER_CONFIG_DEST_FILE:?}
            # we chown from the very topmost directory
            chown -R ${DOCKER_NONROOT_USER:?} ${FORGEJO_CUSTOM_DEST_DIR:?}
            # also remember to chown this volume!
            chown -R ${DOCKER_NONROOT_USER:?} ${GIT_SERVER_DATA_DEST_DIR:?}
          '
    post_start:
      # register the runner in the main forgejo container
      - command: forgejo forgejo-cli actions register --keep-labels --secret ${FORGEJO_SHARED_SECRET:?}
        user: ${DOCKER_NONROOT_USER:?}
    depends_on:
      nginx:
        condition: service_healthy
      iocaine:
        condition: service_started
      git_server_anubis:
        condition: service_healthy
      git_server_mysql:
        condition: service_healthy

  git_server_mysql:
    container_name: git_server_mysql
    extends:
      file: ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_UTILS:?}/shared_sckts.yaml
      service: shared_sckts_user
    profiles:
      - ${DOCKER_DEFAULT_PROFILE:?}
    image: mysql:9.7
    command: --skip-networking --socket=${GIT_SERVER_MYSQL_SCKT:?}
    restart: unless-stopped
    user: ${DOCKER_NONROOT_USER:?}
    volumes:
      # for persisting database
      # SYNC: source path with mysql data directory on host
      - type: bind
        source: ./mysql/mysql_data_dir/
        target: /var/lib/mysql/
    environment:
      MYSQL_DATABASE: ${GIT_SERVER_MYSQL_DB_NAME:?}
      MYSQL_ROOT_PASSWORD: ${GIT_SERVER_MYSQL_ROOT_PASSWORD:?}
      MYSQL_USER: ${GIT_SERVER_MYSQL_USERNAME:?}
      MYSQL_PASSWORD: ${GIT_SERVER_MYSQL_PASSWORD:?}
    healthcheck:
      test: [
        "CMD", "mysqladmin", "ping", "-S", "${GIT_SERVER_MYSQL_SCKT:?}",
        "-u", "root", "-password=${GIT_SERVER_MYSQL_PASSWORD:?}"
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  forgejo_runner_dind:
    container_name: forgejo_runner_dind
    profiles:
      - ${DOCKER_DEFAULT_PROFILE:?}
    image: docker:dind
    restart: unless-stopped
    privileged: true
    hostname: ${FORGEJO_RUNNER_DIND_HOSTNAME:?}
    volumes:
      - type: volume
        source: forgejo_runner_certs
        target: ${FORGEJO_RUNNER_CERTS_DEST_DIR:?}
    environment:
      DOCKER_HOST: forgejo_runner_dind
      DOCKER_TLS_CERTDIR: ${FORGEJO_RUNNER_CERTS_DEST_DIR:?}
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  forgejo_runner:
    container_name: forgejo_runner
    profiles:
      - ${DOCKER_DEFAULT_PROFILE:?}
    image: data.forgejo.org/forgejo/runner:13
    command: forgejo-runner --config ${FORGEJO_RUNNER_CONFIG_DEST_FILE:?} daemon
    restart: unless-stopped
    user: ${DOCKER_NONROOT_USER:?}
    volumes:
      # certs for encrypted communications with dind
      - type: volume
        source: forgejo_runner_certs
        target: ${FORGEJO_RUNNER_CERTS_DEST_DIR:?}
      # container-generated data
      - type: volume
        source: forgejo_runner_data
        target: ${FORGEJO_RUNNER_DATA_DEST_DIR:?}
      # host-provided data
      - type: bind
        source: ${FORGEJO_RUNNER_CONFIG_SRC_DIR:?}
        target: ${FORGEJO_RUNNER_CONFIG_DEST_DIR:?}
    env_file:
      # for `envsubst`
      - ./.env
    environment:
      DOCKER_HOST: tcp://${FORGEJO_RUNNER_DIND_HOSTNAME:?}:2376
      DOCKER_TLS_VERIFY: 1
      DOCKER_CERT_PATH: ${FORGEJO_RUNNER_CLIENT_CERTS_DEST_DIR:?}
    pre_start:
      # SYNC: paths inside container
      - image: akubrinsky/envsubst
        user: ${DOCKER_ROOT_USER:?}
        # note that `sh -c` is required for `envsubst` (probably because it deals with env vars?)
        command: >
          sh -c '
            [ -f ${FORGEJO_RUNNER_CONFIG_DEST_FILE:?}.template ] \
              && envsubst < ${FORGEJO_RUNNER_CONFIG_DEST_FILE:?}.template \
              > ${FORGEJO_RUNNER_CONFIG_DEST_FILE:?}
            chown -R ${DOCKER_NONROOT_USER:?} ${FORGEJO_RUNNER_CONFIG_DEST_DIR:?}
            # also remember to chown these volumes!
            chown -R ${DOCKER_NONROOT_USER:?} ${FORGEJO_RUNNER_CERTS_DEST_DIR:?}
            chown -R ${DOCKER_NONROOT_USER:?} ${FORGEJO_RUNNER_DATA_DEST_DIR:?}
          '
    depends_on:
      forgejo_runner_dind:
        # we don't really need to wait for this to be healthy
        condition: service_started
      git_server:
        condition: service_healthy

volumes:
  git_server_data:
  forgejo_runner_certs:
  forgejo_runner_data:
